{% if messages %}
<div class="row mb-3">
    <div class="col-12">
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags %}{{ message.tags }}{% else %}info{% endif %} alert-dismissible fade show shadow-sm border-0 d-flex align-items-center justify-content-between rounded-3 py-2 px-3 mb-2" role="alert">
            <div class="d-flex align-items-center gap-2">
                {% if message.tags == 'success' %}
                    <i class="bi bi-check-circle-fill text-success fs-5"></i>
                {% elif message.tags == 'error' or message.tags == 'danger' %}
                    <i class="bi bi-exclamation-triangle-fill text-danger fs-5"></i>
                {% elif message.tags == 'warning' %}
                    <i class="bi bi-exclamation-circle-fill text-warning fs-5"></i>
                {% else %}
                    <i class="bi bi-info-circle-fill text-primary fs-5"></i>
                {% endif %}
                <span class="small fw-medium">{{ message }}</span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.75rem;"></button>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
